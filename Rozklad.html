.dt h2{font:600 21px/1.25 var(--display);letter-spacing:-.01em;color:var(--ink)}
.dt .tag{justify-content:center}
.nav{width:44px;height:44px;flex:none;display:grid;place-items:center;padding:0;border:1px solid var(--muted);border-radius:var(--r);background:none;color:var(--ink);cursor:pointer;transition:background-color var(--dur)}
.nav:hover{background:var(--well)}.nav:disabled{opacity:.35;cursor:default;background:none}
.today{align-self:center;display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font:600 14px var(--sans);cursor:pointer;transition:background-color var(--dur)}
.today:hover{background:var(--accent-2)}
#dnote:empty{display:none}
#dnote a{color:var(--ink)}
/* занятия дня */
.les{list-style:none;padding:0;display:flex;flex-direction:column}
.le:not([data-c]){--tone:var(--muted)}
.le{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:12px;padding:12px 0 12px 12px;border-top:1px solid var(--rule);border-left:3px solid var(--tone)}
.le+.le,.gap+.le{margin-top:6px}
.tm{display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.tm b{font:600 17px/1.3 var(--mono);color:var(--ink)}
.tm span{font:14px/1.4 var(--mono);color:var(--muted)}
.tm i{margin-top:4px;font-style:normal;font-size:12px;color:var(--muted)}
.bd{min-width:0;display:flex;flex-direction:column;gap:6px}
.bd h3{font:600 16px/1.35 var(--sans);color:var(--ink);overflow-wrap:break-word;hyphens:auto}
.mt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:14px;color:var(--ink-2)}
.ty{padding:1px 8px;border-radius:var(--r);background:var(--tint);color:var(--tone);font-size:13px;font-weight:600}
.le:not([data-c]) .ty{background:var(--well);color:var(--muted)}
.who,.ex{display:inline-flex;align-items:center;gap:6px}
.who .i,.ex .i{font-size:12px;color:var(--muted)}
.ex{font-size:13px;color:var(--muted)}
.st{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.le.past{opacity:.6}
.le.past h3{font-weight:500}
.le.cur{background:var(--tint);border-left-color:var(--accent);padding-right:12px}
.le.cur .st{color:var(--accent)}
.le.nx .st{color:var(--accent)}
.pr{height:4px;background:var(--rule)}.pr i{display:block;height:100%;background:var(--accent)}
.gap{margin-top:6px;padding:6px 0 6px 15px;font-size:13px;color:var(--muted);border-top:1px dashed var(--rule)}
.free{padding:16px 12px;color:var(--muted);border-top:1px solid var(--rule)}
@media(max-width:480px){.dt h2{font-size:19px}.cd{min-height:48px}.le{grid-template-columns:3.6rem minmax(0,1fr);gap:10px;padding-left:10px}.tm b{font-size:16px}}
/* широкий экран: календарь слева (прилипает), день справа */
@media(min-width:900px){
  .wrap{max-width:64rem}
  main.wrap{display:grid;grid-template-columns:22rem minmax(0,1fr);align-items:start}
  .ctl{position:sticky;top:72px}
}

  // выбранный день: сегодня, до сессии — первый, после — последний
  function todayIdx() { var k = key(now()); if (k in dayIdx) return dayIdx[k]; return k < D.days[0][0] ? 0 : D.days.length - 1; }
  var sel = todayIdx();
  var h = location.hash.slice(1); if (h in dayIdx) sel = dayIdx[h];

  function relDay(iso) {
    var n = Math.round((pd(iso) - pd(key(now()))) / 864e5);
    return n === 0 ? 'Сьогодні' : n === 1 ? 'Завтра' : n === -1 ? 'Учора' : n < 0 ? 'Минуло' : 'Через ' + plural(n, 'день', 'дні', 'днів');
  }
  function title(iso) { var t = pd(iso); return WD[t.getDay()] + ', ' + t.getDate() + ' ' + MON[t.getMonth()]; }

  // ближайшее занятие после момента t (для подсказки «далі»)
  function nextAfter(t) {
    var best = null;
    D.L.forEach(function (l) { if (!(l[4] & mask())) return; var s = at(D.days[l[0]][0], l[1]); if (s > t && (!best || s < best.s)) best = { s: s, l: l }; });
    return best;
  }

  function renderCal() {
    var cal = d.getElementById('cal'); cal.textContent = '';
    WS.forEach(function (w) { cal.appendChild(el('span', 'wd', w)); });
    var start = new Date(first); start.setDate(start.getDate() - (start.getDay() + 6) % 7);
    var end = new Date(last); end.setDate(end.getDate() + (7 - end.getDay()) % 7);
    var tk = key(now());
    for (var t = new Date(start); t <= end; t.setDate(t.getDate() + 1)) {
      var k = key(t), di = dayIdx[k];
      if (di == null) { cal.appendChild(el('span', 'cd off')); continue; }
      var ls = lessons(di), b = el('button', 'cd');
      b.type = 'button'; b.setAttribute('data-d', di);
      if (k < tk) b.classList.add('past');
      if (k === tk) b.classList.add('now');
      if (di === sel) { b.classList.add('on'); b.setAttribute('aria-current', 'date'); }
      b.appendChild(el('b', '', t.getDate()));
      var dots = el('span', 'dots');
      ls.forEach(function (l) { var x = el('i'); var c = TYPE[l[6]][1]; if (c) x.setAttribute('data-c', c); dots.appendChild(x); });
      b.appendChild(dots);
      var ex = ls.filter(function (l) { return l[6] === 'ekz' || l[6] === 'zal'; }).map(function (l) { return TYPE[l[6]][0].toLowerCase(); });
      b.setAttribute('aria-label', title(k) + ', ' + (ls.length ? plural(ls.length, 'заняття', 'заняття', 'занять') : 'занять немає') + (ex.length ? ', ' + ex.join(', ') : ''));
      cal.appendChild(b);
    }
  }

  function renderDay() {
    var iso = D.days[sel][0], ls = lessons(sel), t = now(), tk = key(t);
    d.getElementById('dt').textContent = title(iso);
    var rel = relDay(iso);
    var sum = rel + ' · ' + (ls.length ? plural(ls.length, 'заняття', 'заняття', 'занять') + ', ' + hm(ls[0][1]) + '–' + hm(ls[ls.length - 1][2]) : 'занять немає');
    d.getElementById('dsum').textContent = sum;
    d.getElementById('prev').disabled = sel === 0;
    d.getElementById('next').disabled = sel === D.days.length - 1;
    d.getElementById('today').hidden = iso === tk || !(tk in dayIdx);

    // подсказка: когда день сегодняшний и занятия кончились / до сессии / после
    var note = d.getElementById('dnote'); note.textContent = '';
    var nx = nextAfter(t), msg = '';
    var doneToday = iso === tk && ls.length && at(iso, ls[ls.length - 1][2]) <= t;
    if (iso === tk && (!ls.length || doneToday)) msg = (ls.length ? 'На сьогодні все.' : 'Сьогодні занять немає.');
    else if (tk < D.days[0][0] && sel === 0) msg = 'Сесія ще не почалася.';
    else if (tk > D.days[D.days.length - 1][0]) msg = 'Сесію завершено.';
    if (msg) {
      var n = el('div', 'note info'); n.appendChild(icon('circle-info'));
      var tx = el('div', '', msg + ' ');
      if (nx && key(nx.s) !== iso) {
        var a = el('a', '', 'Наступне: ' + title(key(nx.s)).toLowerCase() + ', ' + hm(nx.l[1]) + ' — ' + D.subj[nx.l[5]]);
        a.href = '#' + key(nx.s);
        tx.appendChild(a);
      }
      n.appendChild(tx); note.appendChild(n);
    }

    var list = d.getElementById('list'); list.textContent = '';
    if (!ls.length) { list.appendChild(el('li', 'free', 'Вільний день — занять у розкладі немає.')); return; }
    var nextMarked = false, prevEnd = null;
    ls.forEach(function (l) {
      var s = at(iso, l[1]), e = at(iso, l[2]);
      if (prevEnd) {
        var gap = (s - prevEnd) / 6e4;
        if (gap > 20) list.appendChild(el('li', 'gap', 'Вікно ' + dur(gap)));
      }
      prevEnd = e;
      var ty = TYPE[l[6]] || TYPE[''], li = el('li', 'le');
      if (ty[1]) li.setAttribute('data-c', ty[1]);
      var st = null;
      if (e <= t) { li.classList.add('past'); st = 'Завершено'; }
      else if (s <= t) { li.classList.add('cur'); st = 'Йде зараз · ще ' + dur((e - t) / 6e4); }
      else if (!nextMarked && iso === tk) { li.classList.add('nx'); st = 'Далі · через ' + dur((s - t) / 6e4); }
      if (s > t && iso === tk) nextMarked = true;

      var tm = el('div', 'tm'); tm.appendChild(el('b', '', hm(l[1]))); tm.appendChild(el('span', '', hm(l[2]))); tm.appendChild(el('i', '', RN[l[3]] ? RN[l[3]] + ' пара' : ''));
      var bd = el('div', 'bd');
      if (st) { var sl = el('div', 'st'); sl.appendChild(icon(li.classList.contains('past') ? 'circle-check' : 'clock')); sl.appendChild(d.createTextNode(st)); bd.appendChild(sl); }
      bd.appendChild(el('h3', '', D.subj[l[5]]));
      var mt = el('div', 'mt');
      mt.appendChild(el('span', 'ty', ty[0]));
      if (D.teach[l[7]]) { var p = el('span', 'who'); p.appendChild(icon('user')); p.appendChild(d.createTextNode(D.teach[l[7]])); mt.appendChild(p); }
      bd.appendChild(mt);
      var extra = [];
      if (l[4] & 32) extra.push('для всього потоку');
      else if (g === 'all') extra.push(D.groups.filter(function (x, i) { return l[4] >> i & 1; }).join(', '));
      if (l[8]) extra.push(l[8]);
      if (extra.length) { var x = el('div', 'ex'); x.appendChild(icon('users')); x.appendChild(d.createTextNode(extra.join(' · '))); bd.appendChild(x); }
      if (li.classList.contains('cur')) { var pr = el('div', 'pr'), fill = el('i'); fill.style.width = Math.round((t - s) / (e - s) * 100) + '%'; pr.appendChild(fill); bd.appendChild(pr); }
      li.appendChild(tm); li.appendChild(bd); list.appendChild(li);
    });
  }

  function renderLegend() {
    var lg = d.getElementById('legend'); lg.textContent = '';
    ['lek', 'kons', 'zal', 'ekz'].forEach(function (k) {
      if (!D.L.some(function (l) { return l[6] === k && l[4] & mask(); })) return;
      var s = el('span'), i = el('i'); i.setAttribute('data-c', TYPE[k][1]); s.appendChild(i); s.appendChild(d.createTextNode(TYPE[k][0])); lg.appendChild(s);
    });
  }

  function render() {
    [].forEach.call(seg.children, function (b) { var on = b.getAttribute('data-g') === g; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    renderCal(); renderDay(); renderLegend();
  }

  function go(i) { if (i < 0 || i >= D.days.length) return; sel = i; history.replaceState(null, '', '#' + D.days[i][0]); render(); }
  d.getElementById('cal').addEventListener('click', function (e) { var b = e.target.closest('[data-d]'); if (b) go(+b.getAttribute('data-d')); });
  d.getElementById('prev').addEventListener('click', function () { go(sel - 1); });
  d.getElementById('next').addEventListener('click', function () { go(sel + 1); });
  d.getElementById('today').addEventListener('click', function () { go(todayIdx()); });
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (h in dayIdx) { sel = dayIdx[h]; render(); d.getElementById('day').scrollIntoView({ block: 'start' }); } });
  // свайп по дню — соседний день
  var sx = null, sy = null, dayEl = d.getElementById('day');
  dayEl.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  dayEl.addEventListener('touchend', function (e) {
    if (sx == null) return; var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(sel + (dx < 0 ? 1 : -1));
  });
  // время идёт: обновление раз в 30 с и при возврате на вкладку (смена суток — тоже)
  var lastKey = key(now());
  function tick() { var k = key(now()); if (k !== lastKey && D.days[sel][0] === lastKey && k in dayIdx) sel = dayIdx[k]; lastKey = k; render(); }
  setInterval(tick, 30000);
  d.addEventListener('visibilitychange', function () { if (!d.hidden) tick(); });
  render();
})();
</script>

<!--base-js--><script>
/* Общий скрипт всех страниц (правка здесь → python tools/build.py): копирование, вкладки, «Усі команди»,
   оглавление, поиск по вопросам, тема, значок вкладки браузера. */
(function () {
  var d = document, toastTimer;
  function all(sel, root) { return [].slice.call((root || d).querySelectorAll(sel)); }

  all('pre[data-collect]').forEach(function (p) {
    var lines = all('pre', d.getElementById(p.getAttribute('data-collect'))).map(function (x) { return x.textContent.trim(); });
    if (p.getAttribute('data-after')) lines.push(p.getAttribute('data-after'));
    p.textContent = lines.join('\n');
  });
  var logo = d.querySelector('.logo');
  var fav = d.getElementById('favicon');
  if (logo && fav) fav.href = logo.src;
  // вкладки: роли для экранного диктора
  all('[data-tab]').forEach(function (b) { b.setAttribute('role', 'tab'); });
  // «Скопіювати» без подписи на узком экране — имя для диктора
  all('[data-copy]').forEach(function (b) { var s = b.querySelector('span'); if (s && !b.getAttribute('aria-label')) b.setAttribute('aria-label', s.textContent); });

  // оглавление: nav[data-toc] — из заголовков разделов (номер .num + h2); раздел без id получает s1, s2…
  all('[data-toc]').forEach(function (nav) {
    var ol = d.createElement('ol');
    all('main .sec').forEach(function (s, i) {
      var h = s.querySelector('h2'), n = s.querySelector('.num');
      if (!h) return;
      if (!s.id) s.id = 's' + (i + 1);
      var li = d.createElement('li'), a = d.createElement('a'), a1 = d.createElement('span'), a2 = d.createElement('span');
      a.href = '#' + s.id; a1.textContent = n ? n.textContent : i + 1; a2.textContent = h.textContent;
      a.appendChild(a1); a.appendChild(a2); li.appendChild(a); ol.appendChild(li);
    });
    nav.appendChild(ol);
  });

  // поиск: input[data-search] фильтрует вопросы details.q (раскрывает найденные), прячет пустые разделы, .empty — «нічого»
  function norm(s) { return s.toLowerCase().replace(/[’ʼ`]/g, "'"); }
  all('input[data-search]').forEach(function (inp) {
    var items = all('details.q'), empty = d.querySelector('.empty');
    function run() {
      var q = norm(inp.value.trim()), n = 0;
      items.forEach(function (it) {
        var hit = !q || norm(it.textContent).indexOf(q) >= 0;
        it.hidden = !hit; if (hit) n++;
        if (q) it.open = hit;
      });
      all('main .sec').forEach(function (s) {
        var qs = all('details.q', s);
        if (qs.length) s.hidden = qs.every(function (x) { return x.hidden; });
      });
      if (empty) empty.hidden = n > 0;
    }
    var m = /[?&]q=([^&]*)/.exec(location.search);
    if (m) inp.value = decodeURIComponent(m[1].replace(/\+/g, ' '));
    inp.addEventListener('input', run);
    run();
  });

  // #id в адресе открывает этот вопрос / блок
  function openHash() {
    var t = location.hash && d.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (t && t.tagName === 'DETAILS') { t.open = true; t.scrollIntoView(); }
  }
  openHash();
  window.addEventListener('hashchange', openHash);

  function toast(msg) {
    var t = d.getElementById('toast');
    t.lastChild.textContent = msg;
    t.className = 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ''; }, 2500);
  }
  function fallback(text) {
    var ta = d.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    d.body.appendChild(ta); ta.select();
    var ok = false; try { ok = d.execCommand('copy'); } catch (e) {}
    d.body.removeChild(ta);
    return ok;
  }
  function copy(text, done) {
    function bad() { if (fallback(text)) done(); else toast('Не вдалося скопіювати — виділіть і Ctrl+C'); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, bad);
    else bad();
  }

  d.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]');
    if (b) {
      e.preventDefault(); e.stopPropagation();   // кнопка в <summary> не сворачивает блок
      var every = b.getAttribute('data-copy') === 'all';
      var pre = (every ? b.closest('details') : b.closest('.line')).querySelector('pre');
      copy(pre.textContent.trim() + (every ? '\n' : ''), function () {
        var use = b.querySelector('use'), span = b.querySelector('span'), text = span && span.textContent;
        use.setAttribute('href', '#i-check'); b.classList.add('ok');
        if (span) span.textContent = 'Скопійовано!';
        toast(every ? 'Усі команди скопійовано' : 'Команду скопійовано');
        setTimeout(function () {
          use.setAttribute('href', '#i-copy'); b.classList.remove('ok');
          if (span) span.textContent = text;
        }, 2000);
      });
      return;
    }
    if (e.target.closest('.theme')) {
      var light = d.documentElement.classList.toggle('light');
      try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (er) {}
      return;
    }
    var v = e.target.closest('[data-v]');
    if (v) { copy(v.getAttribute('data-v'), function () { toast('Скопійовано: ' + v.getAttribute('data-v')); }); return; }
    var t = e.target.closest('[data-tab]');
    if (t) {
      [].forEach.call(t.parentNode.children, function (x) {
        x.classList.toggle('on', x === t);
        x.setAttribute('aria-selected', x === t);
        d.getElementById(x.getAttribute('data-tab')).hidden = x !== t;
      });
    }
  });
})();
</script><!--/base-js-->
